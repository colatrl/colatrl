name: test
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: install tools
      run: sudo apt-get -yq update && sudo apt-get -yq install clang-format clang-tools
    - name: clang-format
      run: clang-format --style llvm src/*.[ch]
    - name: install deps
      run: apt-get -yq update && sudo apt-get -yq install clang-19 g++ libc6-dev-i386
    - name: scan-build
      run: cd src && scan-build make
  build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: install deps
      run: apt-get -yq update && sudo apt-get -yq install clang-19 g++ libc6-dev-i386 devscripts debhelper
    - name: build test
      run: cd src && sudo make install && sudo make clean && cd ..
    - name: build pkg
      run: mkdir -p pkg/colatrl-1.0 && cp -a ../../src/* . && tar zxvf ../colatrl_1.0.orig.tar.gz && debuild -us -uc


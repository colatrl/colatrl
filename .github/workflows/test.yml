name: test
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: install tools
      run: sudo apt-get -yq update && sudo apt-get -yq install clang-format clang-tools clang-19 g++ libc6-dev-i386
    - name: clang-format
      run: clang-format --style llvm *.[ch]
    - name: scan-build
      run: scan-build make
  build-test:
    runs-on: ubuntu-latest
    environment:
      name: "release"
    steps:
    - uses: actions/checkout@v5
    - name: install deps
      run: sudo apt-get -yq update && sudo apt-get -yq install build-essential clang-19 g++ libc6-dev-i386 devscripts debhelper git-buildpackage
    - name: Import GPG key
      uses: crazy-max/ghaction-import-gpg@v7
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.PASSPHRASE }}
        git_commit_gpgsign: true
        git_user_signingkey: true
    - name: List keys
      run: gpg -K
    - name: build test
      run: sudo make install && sudo make clean
    - name: build pkg
      run: export VER=$(dpkg-parsechangelog -Sversion | sed -E 's/\-[0-9]+$//g') && mkdir -p .pkg/colatrl-${VER} && cp -a * .pkg/colatrl-${VER} && cd .pkg/colatrl-${VER} && tar zcvf ../colatrl_${VER}.orig.tar.gz . && debuild -us -uc -S && debuild -S

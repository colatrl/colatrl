name: release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: "release"
    steps:
    - uses: actions/checkout@v6
    - name: install deps
      run: sudo apt-get -yq update && sudo apt-get -yq install build-essential debhelper devscripts git-buildpackage clang-19 g++ libc6-dev-i386
    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    - name: Import GPG key
      uses: crazy-max/ghaction-import-gpg@v6
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.PASSPHRASE }}
        git_commit_gpgsign: true
        git_user_signingkey: true
    - name: build
      run: sudo make install && sudo make clean
    - name: build pkg
      run: export LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1)) && dch -M -D noble -v "${LATEST_TAG}-1" "${LATEST_TAG}-1" < /dev/null && export VER=$(dpkg-parsechangelog -Sversion | sed -E 's/\-[0-9]+$//g') && mkdir -p .pkg/colatrl-${VER} && cp -a * .pkg/colatrl-${VER} && cd .pkg/colatrl-${VER} && tar zcvf ../colatrl_${VER}.orig.tar.gz . && debuild -us -uc -S && debsign -S
    - name: dput
      run: echo -e "[lp-ppa]\nfqdn = ppa.launchpad.net\nmethod = sftp\nincoming = ~anarkiwi/ubuntu/colatrl/\nlogin = anarkiwi\nallow_unsigned_uploads = 0\n" > ~/.dput.cf && ssh-keyscan ppa.launchpad.net >> ~/.ssh/known_hosts && dput -ddd lp-ppa .pkg/colatrl_*_source.changes
